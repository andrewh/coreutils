site_name: GNU coreutils internals
site_description: Source-level notes on how the GNU coreutils programs are implemented
repo_url: https://github.com/andrewh/coreutils
repo_name: andrewh/coreutils
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Overview:
      - overview/index.md
      - Source layout: overview/source-layout.md
      - Program skeleton: overview/program-skeleton.md
      - Shared infrastructure: overview/shared-infrastructure.md
      - Building and testing: overview/build-and-test.md
      - Utility statistics: overview/utility-stats.md
      - Writing a page: overview/page-template.md
  - Commands:
      - commands/index.md
      - Files and directories:
          - basename: commands/basename.md
          - chcon: commands/chcon.md
          - chmod: commands/chmod.md
          - chown: commands/chown.md
          - chroot: commands/chroot.md
          - cp: commands/cp.md
          - dd: commands/dd.md
